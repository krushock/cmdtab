name: CmdTab
options:
  bundleIdPrefix: com.valeryburtsev
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  xcodeVersion: "27.1"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    DEVELOPMENT_TEAM: LLGJ3RVF6B
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development"
    PROVISIONING_PROFILE_SPECIFIER: ""
    ENABLE_HARDENED_RUNTIME: NO
    SWIFT_STRICT_CONCURRENCY: minimal
    DEAD_CODE_STRIPPING: YES
targets:
  CmdTab:
    type: application
    platform: macOS
    sources:
      - path: CmdTab
        excludes:
          - "Resources/AppIcon.iconset"
    entitlements:
      path: CmdTab/CmdTab.entitlements
      properties: {}
    info:
      path: CmdTab/Info.plist
      properties:
        CFBundleName: CmdTab
        CFBundleDisplayName: CmdTab
        CFBundleIdentifier: com.valeryburtsev.CmdTab
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        CFBundleIconFile: AppIcon
        CFBundlePackageType: APPL
        LSUIElement: true
        LSMinimumSystemVersion: "26.0"
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: "© 2026 Valery Burtsev"
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.valeryburtsev.CmdTab
        PRODUCT_NAME: CmdTab
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        COMBINE_HIDPI_IMAGES: YES
        OTHER_LDFLAGS: ["-F/System/Library/PrivateFrameworks", "-framework", "SkyLight"]
        FRAMEWORK_SEARCH_PATHS: ["$(inherited)", "$(SDKROOT)/System/Library/PrivateFrameworks"]
schemes:
  CmdTab:
    build:
      targets:
        CmdTab: all
    run:
      config: Debug
    archive:
      config: Release
